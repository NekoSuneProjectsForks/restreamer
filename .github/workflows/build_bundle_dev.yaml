name: 'Build restreamer dev images'

on:
    workflow_dispatch:
        inputs:
            registry:
                description: 'Where to push the built images'
                type: choice
                default: both
                options:
                    - github
                    - dockerhub
                    - both
    workflow_call:
        inputs:
            registry:
                description: 'Where to push the built images (github, dockerhub, or both)'
                type: string
                default: both
    schedule:
        - cron: '37 5 * * *'
    push:
        branches-ignore:
            - '**'

jobs:
    docker:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - ui: dev
                      core: core-dev-alpine3.23
                      ffmpeg: ffmpeg8.1.1-alpine3.23
                      platforms: linux/amd64,linux/arm64,linux/arm/v7
                      name: dev
                    - ui: dev
                      core: core-dev-alpine3.23
                      ffmpeg: ffmpeg8.1.1-rpi-alpine3.23
                      platforms: linux/arm64,linux/arm/v7
                      name: rpi-dev
                    - ui: dev
                      core: core-dev-ubuntu24.04
                      ffmpeg: ffmpeg8.1.1-vaapi-ubuntu24.04
                      platforms: linux/amd64
                      name: vaapi-dev
                    - ui: dev
                      core: core-dev-ubuntu24.04
                      ffmpeg: ffmpeg8.1.1-cuda-ubuntu24.04-cuda12.9.1
                      platforms: linux/amd64
                      name: cuda-dev
        steps:
            - name: Resolve registry choice
              id: registry
              run: |
                  echo "value=${{ inputs.registry || 'both' }}" >> "$GITHUB_OUTPUT"

            - name: Checkout
              uses: actions/checkout@v4

            - name: Determine target images
              id: images
              env:
                  REGISTRY: ${{ steps.registry.outputs.value }}
              run: |
                  images=""
                  if [ "$REGISTRY" != "dockerhub" ]; then
                      images="${images}ghcr.io/${{ github.repository }}\n"
                  fi
                  if [ "$REGISTRY" != "github" ]; then
                      images="${images}nekosuneprojectsforks/restreamer\n"
                  fi
                  echo "list<<EOF" >> "$GITHUB_OUTPUT"
                  echo -e "$images" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.images.outputs.list }}
                  tags: |
                      type=raw,value=${{ matrix.name }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@master
              with:
                  platforms: all

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@master

            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request' && steps.registry.outputs.value != 'dockerhub'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to DockerHub
              if: github.event_name != 'pull_request' && steps.registry.outputs.value != 'github'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Multi-Arch
              uses: docker/build-push-action@v5
              with:
                  builder: ${{ steps.buildx.outputs.name }}
                  context: .
                  file: ./Dockerfile
                  build-args: |
                      CORE_REPO=https://github.com/nekosuneprojectsforks/core.git
                      CORE_REF=main
                      UI_REPO=https://github.com/nekosuneprojectsforks/restreamer-ui.git
                      UI_REF=main
                      FFMPEG_IMAGE=datarhei/base:${{ matrix.ffmpeg }}
                  platforms: ${{ matrix.platforms }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
